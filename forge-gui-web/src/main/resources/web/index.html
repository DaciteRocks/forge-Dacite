<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Forge Web</title>
  <style>
    :root { --bg:#14181f; --panel:#1e2530; --line:#2c3542; --text:#e6e9ee; --muted:#8b94a3; --accent:#4aa3ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
    header { padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; position:sticky; top:0; }
    header .turn { color:var(--muted); }
    #status { margin-left:auto; font-size:12px; color:var(--muted); }
    #prompt { padding:8px 14px; background:#182233; border-bottom:1px solid var(--line); min-height:20px; }
    #buttons { display:flex; gap:8px; padding:8px 14px; }
    #buttons button { background:var(--accent); color:#04121f; border:0; border-radius:8px; padding:8px 14px; font-weight:600; }
    #buttons button[disabled] { opacity:.35; }
    .player { border:1px solid var(--line); border-radius:12px; margin:10px 14px; background:var(--panel); }
    .player > h2 { margin:0; padding:8px 12px; font-size:15px; display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--line); }
    .player .life { color:var(--accent); font-weight:700; }
    .player .tag { font-size:11px; color:var(--muted); }
    .zones { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; padding:10px 12px; }
    .zone h3 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
    .zone.compact { align-self:start; }
    .zone-view { background:#2a3444; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font-size:12px; }
    .zone-cards { max-height:60vh; overflow-y:auto; margin-bottom:8px; }
    .zone-cards .opt { margin-bottom:6px; }
    #actionbar { display:flex; gap:8px; flex-wrap:wrap; padding:8px 14px; border-bottom:1px solid var(--line); background:#161c26; }
    #actionbar button { background:#2a3444; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-weight:600; }
    #actionbar button.danger { background:#3a1f24; border-color:#5a2f38; }
    .card { border:1px solid var(--line); border-radius:8px; padding:6px 8px; margin-bottom:6px; background:#171d26; cursor:pointer; }
    .card:active { filter:brightness(1.25); }
    .card.selectable { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
    .card.tapped { transform:rotate(3deg); opacity:.8; }
    .card.sick { border-style:dashed; }
    .card.attacking { border-color:#ff6b6b; box-shadow:0 0 0 1px #ff6b6b inset; }
    .card.blocking { border-color:#5bd6a0; box-shadow:0 0 0 1px #5bd6a0 inset; }
    .card.back { background:repeating-linear-gradient(45deg,#1b2430,#1b2430 6px,#222d3b 6px,#222d3b 12px); color:var(--muted); text-align:center; font-size:11px; }
    .card.cmdr { border-color:#d9a441; box-shadow:0 0 0 1px #d9a441 inset; }
    .card .n { font-weight:600; }
    .card .pt { color:var(--accent); float:right; }
    .card .t { font-size:11px; color:var(--muted); }
    .card .dmg { color:#ff6b6b; font-size:11px; }
    .card .ctrs { margin-top:3px; display:flex; flex-wrap:wrap; gap:3px; }
    .card .attached { margin-top:5px; padding-left:8px; border-left:2px solid var(--line); }
    .ctr { font-size:10px; background:#2a3444; border-radius:6px; padding:1px 5px; color:var(--text); }
    .pip { display:inline-block; min-width:16px; text-align:center; border-radius:6px; padding:1px 5px; font-size:11px; font-weight:700; }
    .pip.W{background:#f4f0d8;color:#2a2410;} .pip.U{background:#b6d7f0;color:#0a2536;}
    .pip.B{background:#3a3540;color:#e6e0ec;} .pip.R{background:#f0b8ac;color:#3a0f08;}
    .pip.G{background:#b7d9b4;color:#0e2a10;} .pip.C{background:#cdd3da;color:#1a2028;}
    .mana, .pctrs { display:inline-flex; gap:4px; align-items:center; }
    .stack { margin:10px 14px; }
    .stack .item { border:1px solid var(--accent); border-radius:8px; padding:6px 10px; margin-bottom:6px; background:#101a28; }
    .combat { margin:10px 14px; }
    .combat h3 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#ff6b6b; }
    .combat .band { border:1px solid #45322f; border-radius:8px; padding:6px 10px; margin-bottom:6px; background:#22181a; }
    .pip.clickable { cursor:pointer; }
    .count { color:var(--muted); font-size:12px; }
    #modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:20px; }
    #modal.show { display:flex; }
    .dialog { background:var(--panel); border:1px solid var(--line); border-radius:12px; max-width:420px; width:100%; padding:16px; }
    .dialog h3 { margin:0 0 10px; }
    .dialog .opt { display:block; width:100%; text-align:left; background:#222d3b; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
    .dialog .opt:active { filter:brightness(1.25); }
    .dialog .opt[disabled] { opacity:.4; }
    .dialog div { margin:4px 0; color:var(--muted); }
    .dialog input { background:#222d3b; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin:4px 0; font:inherit; }
    .dialog select { width:100%; background:#222d3b; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; margin:4px 0 10px; font:inherit; }
    /* Lobby / setup screen */
    #setup { position:fixed; inset:0; background:var(--bg); display:none; align-items:flex-start; justify-content:center; padding:20px; overflow:auto; z-index:20; }
    #setup.show { display:flex; }
    .setup-label { display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:10px; }
    .setup-row { display:flex; align-items:center; gap:10px; margin:8px 0; }
    .setup-row button { background:#2a3444; color:var(--text); border:1px solid var(--line); border-radius:8px; width:40px; height:40px; font-size:20px; font-weight:700; }
    .setup-count { font-size:20px; font-weight:700; min-width:24px; text-align:center; }
    .setup-dialog .start { background:var(--accent); color:#04121f; font-weight:700; margin-top:14px; }
    .setup-dialog .start[disabled] { opacity:.5; }
    .setup-error { background:#3a1f24; border:1px solid #5a2f38; color:#ffb3b3; border-radius:8px; padding:8px 10px; margin:8px 0; }
    /* Searchable deck picker */
    .deckpick { margin:4px 0 10px; }
    .deckpick-current { display:block; width:100%; text-align:left; background:#222d3b; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
    .deckpick-current::after { content:" ▾"; color:var(--muted); }
    .deckpick-panel { border:1px solid var(--line); border-top:0; border-radius:0 0 8px 8px; background:#1b2430; }
    .deckpick-panel input { width:100%; margin:0; border-radius:0; border:0; border-bottom:1px solid var(--line); }
    .deckpick-list { max-height:220px; overflow-y:auto; }
    .deckpick-opt { display:block; width:100%; text-align:left; background:transparent; color:var(--text); border:0; border-bottom:1px solid var(--line); padding:9px 12px; }
    .deckpick-opt:active { background:#2a3444; }
    .deckpick-opt.sel { color:var(--accent); font-weight:600; }
    /* Card-detail overlay (long-press) — independent of the game-question modal */
    .detail-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:20px; z-index:30; }
    .detail-mc { color:var(--accent); font-weight:600; }
    .detail-type { color:var(--muted); font-size:12px; margin:4px 0; }
    .detail-pt { color:var(--accent); font-weight:700; }
    .detail-text { white-space:pre-wrap; margin-top:10px; line-height:1.5; }
  </style>
</head>
<body>
  <header>
    <strong id="title">Forge Web</strong>
    <span class="turn" id="turn"></span>
    <span id="status">connecting…</span>
  </header>
  <div id="prompt"></div>
  <div id="buttons"></div>
  <div id="actionbar"></div>
  <div id="stackWrap"></div>
  <div id="combatWrap"></div>
  <div id="players"></div>
  <div id="modal"></div>
  <div id="setup"></div>
  <script src="app.js"></script>
</body>
</html>
